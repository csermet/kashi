# SonarQube analysis (self-hosted server). Host and token come from CI secrets
# (.github/workflows/sonar.yml), never from this file.
sonar.projectKey=kashi
sonar.projectName=kashi
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Tests sit next to the TS sources (*.test.ts) and in apps/server/tests. A file
# is either a source or a test, never both: the shared dirs are listed in both
# keys, tests are excluded from sources and selected by test.inclusions.
sonar.sources=apps/server/src,apps/server/benchmarks,apps/server/scripts,apps/server/alembic,\
  apps/overlay/src,apps/extension/src,packages/protocol/src,packages/schemas/src,packages/schemas/scripts
sonar.tests=apps/server/tests,apps/overlay/src,apps/extension/src,packages/protocol/src,packages/schemas/src
sonar.test.inclusions=apps/server/tests/**,**/*.test.ts,**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.spec.ts,\
  packages/schemas/src/generated/**,\
  apps/server/benchmarks/data/**,apps/server/benchmarks/results/**,\
  apps/server/benchmarks/eval-kit/**,\
  apps/server/alembic/versions/**
