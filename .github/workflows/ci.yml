name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    name: TypeScript (contracts, extension, overlay)
    runs-on: ubuntu-latest
    env:
      # electron-vite builds don't execute Electron; skip the ~100MB binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate schema fixtures
        run: pnpm --filter @kashi/schemas validate
      - name: Codegen drift check
        run: |
          pnpm --filter @kashi/schemas codegen
          git diff --exit-code -- packages/schemas/src/generated
      - name: Version lockstep guard
        run: node scripts/check-versions.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit tests: the kashi-server live suite self-skips without KASHI_LIVE_URL.
      # Coverage for SonarQube comes from THIS run (no second test pass). No
      # `--` before the flags: pnpm then hands them to the script verbatim and
      # vitest never sees them (measured). lcov
      # paths are package-relative ("src/..."); prefix them so Sonar, whose base
      # dir is the repo root, can match them.
      - run: >-
          pnpm -r test --coverage --coverage.provider=v8 --coverage.reporter=lcov
          '--coverage.include=src/**/*.ts' --coverage.reportsDirectory=coverage
      - name: Repo-relative lcov paths
        run: |
          for pkg in apps/overlay apps/extension; do
            sed -i "s#^SF:#SF:$pkg/#" "$pkg/coverage/lcov.info"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: apps/*/coverage/lcov.info
          retention-days: 3
      - run: pnpm build

  python:
    name: Python (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kashi
          POSTGRES_PASSWORD: kashi
          POSTGRES_DB: kashi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kashi -d kashi"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://kashi:kashi@localhost:5432/kashi
    steps:
      - uses: actions/checkout@v4
      # The upload tests probe REAL audio with ffprobe (types lie, streams
      # don't) — the runner ships no ffmpeg; the server image does.
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run alembic upgrade head
      - run: uv run pytest -q --cov --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: py-coverage
          path: apps/server/coverage.xml
          retention-days: 3


  # A red main went unnoticed for seven weeks in 2026-08/09 (pyright failed, so
  # pytest never ran in CI). Make it loud: a failed push to main opens ONE issue
  # (deduped by label, later failures comment on it) and the next green push to
  # main closes it. Cancelled/skipped runs change nothing.
  main-status:
    name: Report main status
    needs: [ts, python]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const results = Object.entries(JSON.parse(process.env.RESULTS));
            const failed = results.filter(([, r]) => r.result === 'failure').map(([job]) => job);
            const green = results.every(([, r]) => r.result === 'success');
            if (!green && failed.length === 0) return; // cancelled or skipped: no verdict
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'ci-red' });
            if (green) {
              for (const issue of open.data) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `main is green again at ${sha}: ${run}` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
              return;
            }
            const body = `CI on main is red at ${sha} (failed: ${failed.join(', ')}).\n\nRun: ${run}\n\n` +
              'Do not tag a release while this is open. It closes itself on the next green push to main.';
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'CI on main is red', labels: ['ci-red'], body });
            }

  # SonarQube (self-hosted), fed the coverage the jobs above just produced, so
  # tests run once. Push to main only (secrets are not available to fork PRs).
  # Informational, never the reason a run is red — like the homelab CI
  # template's allow_failure.
  sonar:
    name: SonarQube scan
    needs: [ts, python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: blame data and new-code detection
      - uses: actions/download-artifact@v4
        with:
          name: ts-coverage
          path: apps
      - uses: actions/download-artifact@v4
        with:
          name: py-coverage
          path: apps/server
      - name: Scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # A pasted secret often carries a trailing newline, which the scanner
          # sends verbatim and the HTTP layer rejects ("invalid header value").
          SONAR_TOKEN="$(printf '%s' "$SONAR_TOKEN" | tr -d '[:space:]')"
          SONAR_HOST_URL="$(printf '%s' "$SONAR_HOST_URL" | tr -d '[:space:]')"
          export SONAR_TOKEN SONAR_HOST_URL
          if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_HOST_URL / SONAR_TOKEN not set - skipping the scan."
            exit 0
          fi
          # Same pinned scanner image as the homelab CI template (amd64 only).
          # The checkout is mounted at the SAME absolute path: coverage.xml names
          # files under the runner's absolute source dir. Runner uid, and a work
          # dir inside the checkout (the image's /tmp default is not writable).
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SONAR_HOST_URL -e SONAR_TOKEN -e SONAR_USER_HOME=/tmp/.sonar \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9 \
            -Dsonar.projectBaseDir="$GITHUB_WORKSPACE" \
            -Dsonar.projectVersion="${GITHUB_SHA::7}" \
            -Dsonar.working.directory=.scannerwork
