name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    name: TypeScript (contracts, extension, overlay)
    runs-on: ubuntu-latest
    env:
      # electron-vite builds don't execute Electron; skip the ~100MB binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate schema fixtures
        run: pnpm --filter @kashi/schemas validate
      - name: Codegen drift check
        run: |
          pnpm --filter @kashi/schemas codegen
          git diff --exit-code -- packages/schemas/src/generated
      - name: Version lockstep guard
        run: node scripts/check-versions.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit tests: the kashi-server live suite self-skips without KASHI_LIVE_URL.
      - run: pnpm -r test
      - run: pnpm build

  python:
    name: Python (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kashi
          POSTGRES_PASSWORD: kashi
          POSTGRES_DB: kashi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kashi -d kashi"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://kashi:kashi@localhost:5432/kashi
    steps:
      - uses: actions/checkout@v4
      # The upload tests probe REAL audio with ffprobe (types lie, streams
      # don't) — the runner ships no ffmpeg; the server image does.
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run alembic upgrade head
      - run: uv run pytest -q


  # A red main went unnoticed for seven weeks in 2026-08/09 (pyright failed, so
  # pytest never ran in CI). Make it loud: a failed push to main opens ONE issue
  # (deduped by label, later failures comment on it) and the next green push to
  # main closes it. Cancelled/skipped runs change nothing.
  main-status:
    name: Report main status
    needs: [ts, python]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const results = Object.entries(JSON.parse(process.env.RESULTS));
            const failed = results.filter(([, r]) => r.result === 'failure').map(([job]) => job);
            const green = results.every(([, r]) => r.result === 'success');
            if (!green && failed.length === 0) return; // cancelled or skipped: no verdict
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'ci-red' });
            if (green) {
              for (const issue of open.data) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `main is green again at ${sha}: ${run}` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
              return;
            }
            const body = `CI on main is red at ${sha} (failed: ${failed.join(', ')}).\n\nRun: ${run}\n\n` +
              'Do not tag a release while this is open. It closes itself on the next green push to main.';
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'CI on main is red', labels: ['ci-red'], body });
            }
