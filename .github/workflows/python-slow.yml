# The alignment smoke test with the REAL model (torch CPU + the
# ctc-forced-aligner C++ build). Too heavy for every PR: runs on server
# changes to main, weekly, and on demand.
name: Python alignment smoke

on:
  push:
    branches: [main]
    paths: ['apps/server/**']
  schedule:
    - cron: '20 4 * * 1' # Mondays 04:20 UTC
  workflow_dispatch:

jobs:
  align-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Since pipeline 2.33.0 the code default routes English to the production
      # checkpoint (jonatasgrosman XLS-R 1B, ~3.9 GB), so the smoke runs the model
      # production runs; the key changed with the content.
      - name: Cache the HF models (~4.4 GB — XLS-R 1B English + e5-small)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-xlsr-1b-english-e5-small-v3
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ ffmpeg
      - run: uv sync --extra align --extra semantics
      - run: uv run pytest -q -m slow --override-ini addopts=''
