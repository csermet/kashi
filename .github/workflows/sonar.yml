# SonarQube analysis on the self-hosted server, push to main only: secrets are
# not available to pull requests from forks, and main is what ships.
# Host and token are repository secrets (SONAR_HOST_URL, SONAR_TOKEN); until
# both exist the job skips cleanly instead of failing.
name: SonarQube

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: blame data and new-code detection
      - name: Scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_HOST_URL / SONAR_TOKEN not set - skipping the scan."
            exit 0
          fi
          # Same pinned scanner image as the homelab CI template (amd64 only).
          # Run as the runner's uid so the scanner can write its work dir.
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SONAR_HOST_URL -e SONAR_TOKEN -e SONAR_USER_HOME=/tmp/.sonar \
            -v "$PWD:/usr/src" \
            sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9 \
            -Dsonar.projectVersion="${GITHUB_SHA::7}"
