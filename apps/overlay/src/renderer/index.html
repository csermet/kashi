<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- style-src keeps 'unsafe-inline' ONLY for vite dev-mode style
         injection; the BUILD strips the token (tightenCsp plugin) — packaged
         apps ship the strict CSP. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src https: data:"
    />
    <title>Kashi</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- The shared view (@kashi/view) builds its own DOM in <body>;
         src/main.ts is the desktop host that mounts it. -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
